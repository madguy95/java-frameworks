spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/querydsl?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: myuser
    password: mypassword
    driverClassName: org.postgresql.Driver
    hikari:
      connection-init-sql: "SET SESSION lock_timeout = '5000ms';"

#  h2:
#    console:
#      enabled: true

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        jdbc.lob.non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
logging:
  level:
    root: INFO
    org.springframework.web: ERROR
    org.hibernate: INFO
#    org.hibernate.orm.jdbc.bind: TRACE