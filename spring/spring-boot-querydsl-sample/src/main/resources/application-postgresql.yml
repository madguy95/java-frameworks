spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/querydsl?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: myuser
    password: mypassword
#    driverClassName: org.postgresql.Driver
#    hikari:
#      connection-init-sql: "SET SESSION lock_timeout = '5000ms';"

  data:
    mongodb:
      host: localhost
      port: 27017
      database: mongo_db
      username: mongo    # MongoDB username
      password: "123456"   # MongoDB password
      authentication-database: admin  #Authentication database
      auto-index-creation: true   # Automatically create indexes
      write-concern: NORMAL       # Write concern level (e.g., MAJORITY, NORMAL)
      replica-set: <replica_set_name>  # Replica set name (if applicable)

#  h2:
#    console:
#      enabled: true

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        jdbc.lob.non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
logging:
  level:
    root: INFO
    org.springframework.web: ERROR
    org.hibernate: INFO
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
#    org.hibernate.orm.jdbc.bind: TRACE