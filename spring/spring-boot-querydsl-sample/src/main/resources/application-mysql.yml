spring:
  datasource:
    url: jdbc:mysql://localhost:3306/querydsl?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driverClassName: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET @@SESSION.innodb_lock_wait_timeout = 15"

#  h2:
#    console:
#      enabled: true

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate.jdbc.lob.non_contextual_creation: true
logging:
  level:
    root: INFO
    org.springframework.web: ERROR
    org.hibernate: INFO
